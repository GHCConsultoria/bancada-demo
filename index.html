function copiarRelacao(comp, notas) {
  const linhas = [["Emissao", "NF", "Serie", "Fornecedor", "CNPJ", "Valor", "XML", "DANFE"].join(";")];
  notas.forEach(n => {
    const f = fornecedor(n.fornecedorId);
    linhas.push([
      fmtData(n.emissao), n.numero, n.serie, f.nome, f.cnpj,
      String(n.valor.toFixed(2)).replace(".", ","),
      n.arquivos.some(a => a.tipo === "XML") ? "sim" : "NAO",
      n.arquivos.some(a => a.tipo === "DANFE") ? "sim" : "NAO"
    ].join(";"));
  });
  const texto = linhas.join("\n");
  const finalizar = ok => toast(ok ? "Relação copiada — cole no Excel ou no e-mail do contador." : "Não foi possível copiar aqui; use o botão Gerar pacote.");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(() => finalizar(true), () => finalizar(false));
  } else finalizar(false);
}

function modalPacote(comp, notas, pagamentos) {
  const arquivos = [];
  notas.forEach(n => n.arquivos.forEach(a => arquivos.push({ pasta: "01-notas-fiscais", nome: a.nome, tamanho: a.tamanho })));
  pagamentos.forEach(p => { if (p.comprovante) arquivos.push({ pasta: "02-comprovantes", nome: p.comprovante.nome, tamanho: p.comprovante.tamanho }); });
  db.colaboradores.forEach(c => c.docs.filter(d => d.competencia === comp)
    .forEach(d => arquivos.push({ pasta: "03-folha", nome: d.nome, tamanho: d.tamanho })));

  const porPasta = {};
  arquivos.forEach(a => { (porPasta[a.pasta] = porPasta[a.pasta] || []).push(a); });

  abrirModal({
    largo: true,
    titulo: "Pacote da contabilidade · " + rotuloComp(comp),
    corpo: `
      <div class="row" style="gap:22px">
        <div><div class="eyebrow">Arquivos</div><div class="mono t-strong" style="font-size:18px">${arquivos.length}</div></div>
        <div><div class="eyebrow">Notas</div><div class="mono t-strong" style="font-size:18px">${notas.length}</div></div>
        <div><div class="eyebrow">Valor escriturável</div><div class="mono t-strong" style="font-size:18px">${money(notas.reduce((s, n) => s + n.valor, 0))}</div></div>
      </div>
      ${Object.keys(porPasta).sort().map(pasta => `
        <div>
          <div class="eyebrow" style="margin-bottom:7px">${esc(pasta)} · ${porPasta[pasta].length} arquivo(s)</div>
          <div class="row" style="gap:6px">${porPasta[pasta].slice(0, 24).map(a => `<span class="file-pill">${esc(a.nome)}</span>`).join("")}
          ${porPasta[pasta].length > 24 ? `<span class="t-sub">+${porPasta[pasta].length - 24} arquivo(s)</span>` : ""}</div>
        </div>`).join("") || '<div class="empty">Sem arquivos nesta competência.</div>'}
      <div class="note">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.8v.6"/></svg>
        <span>No sistema entregue, este botão gera <strong>${esc("fechamento-" + comp + ".zip")}</strong> com essa estrutura de pastas e envia o link direto para o e-mail do contador. Nesta demonstração o pacote é apenas listado.</span>
      </div>`,
    acoes: [{ rotulo: "Fechar", primaria: true }]
  });
}

/* ==================================================================
   15. EQUIPE E DOCUMENTOS
   ================================================================== */
function renderEquipe() {
  const view = $("#view-equipe");
  const comps = competenciasDisponiveis();
  if (!filtros.equipeComp || !comps.includes(filtros.equipeComp)) filtros.equipeComp = comps[0];
  const comp = filtros.equipeComp;
  const conf = conformidadeEquipe(comp);

  let pessoas = db.colaboradores.map(c => {
    const pend = pendenciasColaborador(c, comp);
    const total = DOCS_PERMANENTES.length + DOCS_MENSAIS.length;
    return { ...c, pend, pct: Math.round(((total - pend.length) / total) * 100) };
  });
  if (filtros.equipeSoPendentes) pessoas = pessoas.filter(p => p.pend.length);
  pessoas.sort((a, b) => a.pct - b.pct || a.nome.localeCompare(b.nome));

  view.innerHTML = `
    <div class="toolbar">
      <label class="field" style="min-width:200px"><span>Competência</span>
        <select id="f-eq-comp">${comps.map(c => `<option value="${c}" ${c === comp ? "selected" : ""}>${rotuloComp(c)}</option>`).join("")}</select>
      </label>
      <div class="seg" style="align-self:flex-end">
        <button type="button" data-pend="false" aria-pressed="${!filtros.equipeSoPendentes}">Todos (${db.colaboradores.length})</button>
        <button type="button" data-pend="true" aria-pressed="${filtros.equipeSoPendentes}">Com pendência (${db.colaboradores.filter(c => pendenciasColaborador(c, comp).length).length})</button>
      </div>
      <span class="spacer"></span>
      <button class="btn primary" type="button" id="b-fiscalizacao">Modo fiscalização</button>
    </div>

    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="kpi ${conf.pct === 100 ? "is-good" : "is-warn"}"><span class="k-label">Pasta completa</span><span class="k-value mono">${conf.pct}%</span><span class="k-foot">${conf.ok} de ${conf.total} documentos</span></div>
      <div class="kpi ${conf.pendentes ? "is-crit" : "is-good"}"><span class="k-label">Pendências</span><span class="k-value mono">${conf.pendentes}</span><span class="k-foot">${esc(rotuloComp(comp))}</span></div>
      <div class="kpi is-accent"><span class="k-label">Colaboradores</span><span class="k-value mono">${db.colaboradores.length}</span><span class="k-foot">${Array.from(new Set(db.colaboradores.map(c => c.setor))).length} setores</span></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Pasta do colaborador</h3>
        <span class="hint">contrato, identidade, ASO, ficha de EPI, holerite, cartão de ponto e comprovante de pagamento</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Colaborador</th><th>Cargo</th><th>Setor</th><th>Admissão</th><th style="width:150px">Pasta</th><th>Pendências</th><th class="tight"></th></tr></thead>
          <tbody>
            ${pessoas.length ? pessoas.map(p => {
              const nivel = p.pct === 100 ? "good" : p.pct >= 80 ? "warn" : "crit";
              return `<tr class="row-flag ${p.pct === 100 ? "" : nivel}">
                <td><div class="t-strong">${esc(p.nome)}</div><div class="t-sub mono">mat. ${esc(p.matricula)} · ${esc(p.cpf)}</div></td>
                <td class="t-sub">${esc(p.cargo)}</td>
                <td><span class="chip neutral">${esc(p.setor)}</span></td>
                <td class="mono t-sub">${fmtData(p.admissao)}</td>
                <td>
                  <div class="row" style="gap:8px;flex-wrap:nowrap">
                    <div class="meter ${nivel}" style="flex:1"><i style="width:${p.pct}%"></i></div>
                    <span class="mono t-sub">${p.pct}%</span>
                  </div>
                </td>
                <td>${p.pend.length
                  ? p.pend.slice(0, 2).map(d => `<span class="file-pill missing">${esc(d.tipo)}</span> `).join("") + (p.pend.length > 2 ? `<span class="t-sub">+${p.pend.length - 2}</span>` : "")
                  : '<span class="chip good"><span class="dot"></span>completa</span>'}</td>
                <td class="tight"><button class="btn sm" type="button" data-col="${p.id}">Abrir pasta</button></td>
              </tr>`;
            }).join("") : '<tr><td colspan="7"><div class="empty">Nenhum colaborador no filtro.</div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;

  $("#f-eq-comp").addEventListener("change", e => { filtros.equipeComp = e.target.value; renderEquipe(); });
  $$("#view-equipe .seg button").forEach(b => b.addEventListener("click", () => { filtros.equipeSoPendentes = b.dataset.pend === "true"; renderEquipe(); }));
  $$("#view-equipe [data-col]").forEach(b => b.addEventListener("click", () => pastaColaborador(b.dataset.col, comp)));
  $("#b-fiscalizacao").addEventListener("click", () => modalFiscalizacao(comp));
}

function pastaColaborador(id, comp) {
  const c = db.colaboradores.find(c => c.id === id);
  const pend = pendenciasColaborador(c, comp);
  const permanentes = DOCS_PERMANENTES.map(t => ({ tipo: t, doc: c.docs.find(d => d.tipo === t && !d.competencia) }));
  const mensais = DOCS_MENSAIS.map(t => ({ tipo: t, doc: c.docs.find(d => d.tipo === t && d.competencia === comp) }));

  const bloco = (titulo, itens) => `
    <div>
      <div class="eyebrow" style="margin-bottom:8px">${titulo}</div>
      <div class="doc-grid">
        ${itens.map(i => i.doc
          ? `<div class="doc-cell">
              <span class="d-name">${esc(i.tipo)}</span>
              <span class="d-meta mono">${esc(i.doc.nome)}</span>
              <span class="d-meta">${esc(i.doc.tamanho)} · enviado ${fmtData(i.doc.enviadoEm)}</span>
              <button class="btn sm" type="button" data-dv="${esc(i.doc.nome)}" data-dc="${esc(c.nome + " · " + i.tipo)}">Abrir</button>
            </div>`
          : `<div class="doc-cell missing">
              <span class="d-name">${esc(i.tipo)}</span>
              <span class="d-meta" style="color:var(--crit)">Documento não enviado</span>
              <button class="btn sm" type="button" data-up="${c.id}|${esc(i.tipo)}|${i.doc === undefined && DOCS_MENSAIS.includes(i.tipo) ? comp : ""}">Anexar</button>
            </div>`).join("")}
      </div>
    </div>`;

  abrirModal({
    largo: true,
    titulo: c.nome,
    corpo: `
      <div class="row" style="gap:22px">
        <div><div class="eyebrow">Matrícula</div><div class="mono t-strong">${esc(c.matricula)}</div></div>
        <div><div class="eyebrow">Cargo</div><div class="t-strong">${esc(c.cargo)}</div></div>
        <div><div class="eyebrow">Setor</div><div class="t-strong">${esc(c.setor)}</div></div>
        <div><div class="eyebrow">Admissão</div><div class="mono t-strong">${fmtData(c.admissao)}</div></div>
        <div><div class="eyebrow">Situação</div>${pend.length
          ? `<span class="chip crit"><span class="dot"></span>${pend.length} pendência(s)</span>`
          : '<span class="chip good"><span class="dot"></span>pasta completa</span>'}</div>
      </div>
      ${bloco("Documentos permanentes", permanentes)}
      ${bloco("Competência · " + rotuloComp(comp), mensais)}`,
    acoes: [{ rotulo: "Fechar", primaria: true }]
  });

  $$("#modal-body [data-dv]").forEach(b => b.addEventListener("click", () => verArquivo(b.dataset.dv, b.dataset.dc)));
  $$("#modal-body [data-up]").forEach(b => b.addEventListener("click", () => {
    const [cid, tipo, cp] = b.dataset.up.split("|");
    modalAnexarDoc(cid, tipo, cp || null, comp);
  }));
}

function modalAnexarDoc(cid, tipo, cp, compVoltar) {
  const c = db.colaboradores.find(c => c.id === cid);
  abrirModal({
    titulo: "Anexar · " + tipo,
    corpo: `
      <div class="row" style="gap:22px">
        <div><div class="eyebrow">Colaborador</div><div class="t-strong">${esc(c.nome)}</div></div>
        <div><div class="eyebrow">Documento</div><div class="t-strong">${esc(tipo)}</div></div>
        ${cp ? `<div><div class="eyebrow">Competência</div><div class="mono t-strong">${esc(rotuloComp(cp))}</div></div>` : ""}
      </div>
      <label class="field"><span>Arquivo</span><input name="arquivo" type="file"></label>`,
    acoes: [
      { rotulo: "Cancelar", aoClicar: () => { fecharModal(); pastaColaborador(cid, compVoltar); } },
      { rotulo: "Anexar", primaria: true, aoClicar: () => {
        const input = $('#modal-body input[name="arquivo"]');
        const f = input && input.files && input.files[0];
        c.docs.push({
          tipo, competencia: cp,
          nome: f ? f.name : tipo.toLowerCase().replace(/[^a-z0-9]+/g, "-") + (cp ? "-" + cp : "") + ".pdf",
          tamanho: f ? Math.max(1, Math.round(f.size / 1024)) + " KB" : "—",
          enviadoEm: iso(hoje())
        });
        salvar(); atualizarBadges();
        fecharModal(); pastaColaborador(cid, compVoltar);
        toast(tipo + " anexado à pasta de " + c.nome.split(" ")[0] + ".");
      }}
    ]
  });
}

function modalFiscalizacao(comp) {
  const linhas = db.colaboradores.map(c => ({ c, pend: pendenciasColaborador(c, comp) }));
  const totalPend = linhas.reduce((s, l) => s + l.pend.length, 0);
  abrirModal({
    largo: true,
    titulo: "Modo fiscalização · " + rotuloComp(comp),
    corpo: `
      <div class="note">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.8 13.5 4v4.2c0 3-2.3 5-5.5 6-3.2-1-5.5-3-5.5-6V4z"/><path d="M5.8 8.1 7.3 9.6l3-3.2"/></svg>
        <span>Tela única para apresentar numa visita do Ministério do Trabalho: todo colaborador, o que está na pasta e o que falta. ${totalPend ? "<strong>Resolva as " + totalPend + " pendências abaixo antes.</strong>" : "<strong>Todas as pastas estão completas.</strong>"}</span>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Colaborador</th><th>Admissão</th>${DOCS_PERMANENTES.concat(DOCS_MENSAIS).map(t => `<th style="text-align:center">${esc(t.replace("Documento de identidade", "Identidade").replace("Comprovante de pagamento", "Comprovante"))}</th>`).join("")}</tr></thead>
        <tbody>
          ${linhas.map(({ c, pend }) => `<tr class="row-flag ${pend.length ? "crit" : "good"}">
            <td><div class="t-strong">${esc(c.nome)}</div><div class="t-sub">${esc(c.cargo)}</div></td>
            <td class="mono t-sub">${fmtData(c.admissao)}</td>
            ${DOCS_PERMANENTES.concat(DOCS_MENSAIS).map(t => {
              const ok = !pend.some(p => p.tipo === t);
              return `<td style="text-align:center">${ok
                ? '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--good)" stroke-width="2" aria-label="presente"><path d="M3 8.4 6.3 11.7 13 5"/></svg>'
                : '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--crit)" stroke-width="2" aria-label="faltando"><path d="M4 4l8 8M12 4l-8 8"/></svg>'}</td>`;
            }).join("")}
          </tr>`).join("")}
        </tbody>
      </table></div>`,
    acoes: [{ rotulo: "Fechar", primaria: true }]
  });
}

/* ==================================================================
   16. INICIALIZAÇÃO
   ================================================================== */
function aplicarTema(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  try { t ? localStorage.setItem("bancada.tema", t) : localStorage.removeItem("bancada.tema"); } catch (e) {}
}
$("#btn-theme").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme");
  const escuroSistema = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const proximo = atual ? (atual === "dark" ? "light" : null) : (escuroSistema ? "light" : "dark");
  aplicarTema(proximo);
  VIEWS[viewAtual].render();
});
$("#btn-reset").addEventListener("click", () => {
  abrirModal({
    titulo: "Recarregar dados de demonstração",
    corpo: '<p style="color:var(--ink-2)">Isso apaga tudo que você lançou nesta sessão e volta a base de exemplo ao estado original. A demonstração roda inteira no seu navegador — nada é enviado a servidor nenhum.</p>',
    acoes: [
      { rotulo: "Cancelar" },
      { rotulo: "Recarregar", primaria: true, aoClicar: () => {
        db = semear(); salvar(); fecharModal(); redesenhar(); toast("Base de demonstração recarregada.");
      }}
    ]
  });
});

try {
  const t = localStorage.getItem("bancada.tema");
  if (t) document.documentElement.setAttribute("data-theme", t);
} catch (e) {}

db = carregar();
$("#today").textContent = fmtData(iso(hoje()));
atualizarBadges();
irPara(location.hash.slice(1) || "painel");
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (VIEWS[v] && v !== viewAtual) irPara(v);
});

// Redesenha os gráficos quando a largura muda (o viewBox depende do container)
let redimTimer;
window.addEventListener("resize", () => {
  clearTimeout(redimTimer);
  redimTimer = setTimeout(() => { if (viewAtual === "painel") renderPainel(); }, 200);
});
</script>
